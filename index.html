<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B Bake Pang - ตะกร้าสินค้า</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: 'Kanit', sans-serif; padding: 20px; background-color: #fdf5f0; }
        .product-card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; }
        .cart-btn { position: fixed; bottom: 20px; right: 20px; background: #8d6e63; color: white; padding: 15px 25px; border-radius: 30px; border: none; font-size: 18px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        .item-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        button { cursor: pointer; border-radius: 5px; border: 1px solid #ddd; padding: 5px 12px; }
        #checkout-btn { background: #4caf50; color: white; border: none; padding: 15px; width: 100%; font-size: 18px; border-radius: 10px; margin-top: 20px; }
        /* เพิ่มสไตล์ปุ่มลบสีแดง */
        .del-btn { background-color: #ff4747; color: white; border: none; margin-left: 5px; }
    </style>
</head>
<body>

    <h2>🍰 เมนู B Bake Pang</h2>
    
    <div class="product-card">
        <div><strong>บราวนี่</strong><br><small>ราคา 25 บาท</small></div>
        <button onclick="addToCart('บราวนี่', 25)">เพิ่มลงตะกร้า</button>
    </div>

    <div class="product-card">
        <div><strong>คุกกี้</strong><br><small>ราคา 35 บาท</small></div>
        <button onclick="addToCart('คุกกี้', 35)">เพิ่มลงตะกร้า</button>
    </div>

    <button class="cart-btn" onclick="showCart()">🛒 ตะกร้า (<span id="count">0</span>)</button>

    <div id="cart-modal" class="modal">
        <h3>🛒 รายการที่เลือก</h3>
        <div id="cart-list"></div>
        <hr>
        <h4>ยอดรวม : <span id="total">0</span> บาท</h4>
        <p>ชื่อผู้รับ : <span id="user-name">กำลังโหลด...</span></p>
        <textarea id="address" placeholder="กรอกที่อยู่จัดส่งสินค้า..." style="width:100%; height:100px; padding:10px; border-radius:8px; border:1px solid #ccc;"></textarea>
        <button id="checkout-btn" onclick="sendOrder()">✅ ยืนยันการสั่งซื้อ</button>
        <button onclick="closeCart()" style="width:100%; margin-top:10px; background:none; border:none; color:gray;">กลับไปเลือกเพิ่ม</button>
    </div>

    <script>
        const WEBHOOK_URL = "https://hook.eu1.make.com/qq81k3lxscdq67yy5y7soxmvt7d6wl3d"; 
        const MY_LIFF_ID = "2009070223-6etDkSk2";

        let cart = [];
        let userName = "";
        let lineUserId = ""; 

        async function initLIFF() {
            await liff.init({ liffId: MY_LIFF_ID });
            if (liff.isLoggedIn()) {
                const profile = await liff.getProfile();
                userName = profile.displayName;
                lineUserId = profile.userId; 
                document.getElementById('user-name').innerText = userName;
            } else {
                liff.login();
            }
        }
        initLIFF();

        function addToCart(name, price) {
            let item = cart.find(i => i.name === name);
            if (item) { item.qty++; } else { cart.push({ name, price, qty: 1 }); }
            updateCartIcon();
            
            const Toast = Swal.mixin({
                toast: true, position: 'top-end', showConfirmButton: false, timer: 1500, timerProgressBar: true
            });
            Toast.fire({ icon: 'success', title: 'เพิ่ม ' + name + ' แล้ว' });
        }

        function showCart() {
            const list = document.getElementById('cart-list');
            list.innerHTML = "";
            let sum = 0;
            cart.forEach((item, idx) => {
                sum += (item.price * item.qty);
                list.innerHTML += `
                    <div class="item-row">
                        <div>
                            <strong>${item.name}</strong><br>
                            <small>${item.price} x ${item.qty} = ${item.price * item.qty} บ.</small>
                        </div>
                        <div>
                            <button onclick="updateQty(${idx}, -1)">-</button>
                            <span style="margin:0 5px;">${item.qty}</span>
                            <button onclick="updateQty(${idx}, 1)">+</button>
                            <button class="del-btn" onclick="removeItem(${idx})">🗑️</button>
                        </div>
                    </div>`;
            });
            document.getElementById('total').innerText = sum;
            document.getElementById('cart-modal').style.display = "block";
        }

        function updateQty(idx, amt) {
            cart[idx].qty += amt;
            if (cart[idx].qty <= 0) cart.splice(idx, 1);
            showCart();
            updateCartIcon();
        }

        // ฟังก์ชันใหม่: ลบสินค้าทันที
        function removeItem(idx) {
            // ถามก่อนลบ เพื่อกันพลาด
            Swal.fire({
                title: 'ลบรายการนี้?',
                text: "คุณต้องการลบ " + cart[idx].name + " ออกจากตะกร้าใช่ไหม?",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ff5252',
                cancelButtonColor: '#aaa',
                confirmButtonText: 'ลบเลย',
                cancelButtonText: 'ยกเลิก'
            }).then((result) => {
                if (result.isConfirmed) {
                    cart.splice(idx, 1); // ลบออกจาก Array
                    showCart(); // อัปเดตหน้าจอ
                    updateCartIcon(); // อัปเดตตัวเลข
                }
            });
        }

        function updateCartIcon() {
            document.getElementById('count').innerText = cart.reduce((s, i) => s + i.qty, 0);
        }

        function closeCart() { document.getElementById('cart-modal').style.display = "none"; }

        async function sendOrder() {
            const addr = document.getElementById('address').value;
            if (!addr) return Swal.fire({ icon: 'warning', title: 'แจ้งเตือน', text: 'กรุณากรอกที่อยู่ด้วยค่ะ', confirmButtonColor: '#8d6e63' });
            if (cart.length === 0) return Swal.fire({ icon: 'warning', title: 'ตะกร้าว่าง', text: 'ยังไม่มีสินค้าในตะกร้า', confirmButtonColor: '#8d6e63' });

            Swal.fire({
                title: 'กำลังส่งออเดอร์...',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading() }
            });

            const orderData = {
                customer: userName,
                userId: lineUserId, 
                items: cart.map(i => `${i.name}(${i.qty})`).join(", "),
                total: document.getElementById('total').innerText,
                address: addr
            };

            try {
                const res = await fetch(WEBHOOK_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(orderData)
                });

                if (res.ok) {
                    Swal.fire({
                        title: 'สำเร็จ!',
                        text: 'ได้รับออเดอร์แล้ว รอแจ้งเลขพัสดุนะคะ 🍪',
                        icon: 'success',
                        confirmButtonText: 'ตกลง',
                        confirmButtonColor: '#8d6e63'
                    }).then(() => {
                        liff.closeWindow();
                    });
                } else {
                    Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: 'ส่งข้อมูลไม่สำเร็จ โปรดลองใหม่' });
                }
            } catch (err) {
                Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: 'เชื่อมต่อไม่ได้: ' + err });
            }
        }
    </script>
</body>
</html>
