<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตะกร้าสินค้า Little Oven</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #fdf2f2; padding: 20px; color: #5d4037; }
        .cart-card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); text-align: center; }
        .qty-control { display: flex; justify-content: center; align-items: center; margin: 20px 0; }
        .btn-round { background: #8d6e63; color: white; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 20px; font-weight: bold; cursor: pointer; }
        .qty-num { font-size: 24px; margin: 0 20px; font-weight: bold; }
        .confirm-btn { background: #5d4037; color: white; width: 100%; padding: 15px; border: none; border-radius: 30px; font-size: 18px; margin-top: 20px; cursor: pointer; font-weight: bold; }
        input { width: 100%; padding: 12px; margin-top: 15px; border-radius: 10px; border: 1px solid #ddd; box-sizing: border-box; }
        .total-section { font-size: 20px; margin: 15px 0; border-top: 1px solid #eee; padding-top: 15px; }
    </style>
</head>
<body>
    <div class="cart-card">
        <h2 id="p-name">กำลังโหลดสินค้า...</h2>
        <p>ราคาชิ้นละ <span id="p-price">0</span> บาท</p>
        
        <div class="qty-control">
            <button class="btn-round" onclick="updateQty(-1)">-</button>
            <span id="qty-display" class="qty-num">1</span>
            <button class="btn-round" onclick="updateQty(1)">+</button>
        </div>

        <div class="total-section">
            ยอดรวม: <b><span id="total-display">0</span> บาท</b>
        </div>

        <input type="text" id="user-address" placeholder="พิมพ์ชื่อ-ที่อยู่ และเบอร์โทร">
        <button class="confirm-btn" onclick="submitOrder()">ยืนยันการสั่งซื้อ</button>
    </div>

    <script>
        let currentQty = 1;
        let unitPrice = 0;
        let productName = "";

        async function main() {
            // 1. เชื่อมต่อกับ LINE LIFF (ต้องเอา ID มาใส่ทีหลัง)
            await liff.init({ liffId: "2009070223-6etDkSk2" });

            // 2. ดึงค่าสินค้าจากปุ่มที่กดมา (URL)
            const urlParams = new URLSearchParams(window.location.search);
            productName = urlParams.get('item') || "สินค้าทั่วไป";
            unitPrice = parseInt(urlParams.get('price')) || 0;

            document.getElementById('p-name').innerText = productName;
            document.getElementById('p-price').innerText = unitPrice;
            calculateTotal();
        }

        function updateQty(n) {
            currentQty += n;
            if (currentQty < 1) currentQty = 1;
            document.getElementById('qty-display').innerText = currentQty;
            calculateTotal();
        }

        function calculateTotal() {
            document.getElementById('total-display').innerText = currentQty * unitPrice;
        }

        async function submitOrder() {
            const address = document.getElementById('user-address').value;
            if (!address) return alert("กรุณากรอกที่อยู่ด้วยครับ");

            const profile = await liff.getProfile();
            
            // 3. ส่งข้อมูลไปที่ Make (ต้องเอา URL Webhook มาใส่)
            const makeWebhookUrl = "https://hook.eu1.make.com/xj5yjmp71m6uxkzamgffdnh4quh0pbvg";
            
            fetch(makeWebhookUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    customer: profile.displayName,
                    item: productName,
                    quantity: currentQty,
                    total: currentQty * unitPrice,
                    address: address
                })
            }).then(() => {
                alert("บันทึกออเดอร์เรียบร้อย!");
                liff.closeWindow(); // ปิดหน้าต่างตะกร้า
            });
        }
        main();
    </script>
</body>
</html>
